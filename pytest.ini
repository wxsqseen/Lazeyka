[pytest]
testpaths = tests
addopts = --strict-markers
# Исключение в фоновом потоке — провал теста, а не предупреждение в конце прогона: поток, тихо
# умерший на ошибке, иначе выглядит как «всё прошло».
filterwarnings =
    error::pytest.PytestUnhandledThreadExceptionWarning
    error::pytest.PytestUnraisableExceptionWarning
# Тесты, которые зависят от переключателя окружения; пропускает их tests/conftest.py, а не каждый файл сам.
markers =
    network: ходит в интернет; пропускается при LAZEYKA_NO_NETWORK=1
    core_check: статическая проверка настоящими ядрами (version, check); только с LAZEYKA_CORE_CHECK=1
    core_e2e: живой прогон ядер на 127.0.0.1; только с LAZEYKA_CORE_E2E=1
